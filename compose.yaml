services:
  postgres:
    image: postgres:16
    container_name: busbooking
    restart: unless-stopped
    environment:
      POSTGRES_DB: busbooking
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - busbooking_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d busbooking" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

