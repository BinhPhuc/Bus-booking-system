worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS: re-resolve backends so a restarted container is picked up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Log which instance served each request.
    log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr time=$request_time';
    access_log /var/log/nginx/access.log upstream;

    upstream backend {
        zone backend 64k;
        server backend-1:8085 resolve max_fails=1 fail_timeout=5s;
        server backend-2:8085 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            # nginx is the edge: overwrite, never append, so a client cannot forge its IP.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fail over quickly when an instance is down. POST is not retried by default,
            # so a booking request is never sent to two instances.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
